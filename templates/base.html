<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>{% block title %}Cosmic Carbon Calculator{% endblock %}</title>
    <meta name="description" content="Estimate and track your carbon footprint">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="{{ url_for('static', filename='base.css') }}">
    {% block style %}{% endblock %}
</head>
<body id="body">

    <header class="nav-bar" id="nav-bar">
        <div class="nav-section">
            <div class="nav-top">
                <button class="menu" id="menu" aria-label="Open menu" aria-expanded="false" aria-controls="nav">&#9776;</button>
                <a class="brand" href="{% if user.is_authenticated %}{{ url_for('views.home') }}{% else %}{{ url_for('auth.login') }}{% endif %}">
                    Cosmic <span>Carbon</span>
                </a>
            </div>

            <nav class="nav" id="nav" aria-hidden="true">
                <div class="profile" aria-hidden="true">
                    <div class="profile_logo">
                        <span id="not-available" style="margin:0;font-size:13px;">N/A</span>
                    </div>
                </div>
                {% if user.is_authenticated %}
                <a class="nav-item" href="{{ url_for('views.home') }}">Home</a>
                <a href="{{ url_for('views.dashboard') }}">Dashboard</a>
                <a href="{{ url_for('views.about') }}">About</a>
                <button class="back" id="recent" type="button" aria-expanded="false" aria-controls="history-panel">Recent</button>
                <div id="history-panel" class="history-panel" aria-hidden="true">
                    <div class="history-latest">
                        <span class="history-latest-label">Latest total</span>
                        <span class="history-latest-value" id="history-latest-value">—</span>
                    </div>
                    <table id="history">
                        <tbody id="history-body">
                            <tr id="empty"><td><small style="color:#c8e0de;">No recent emissions</small></td></tr>
                        </tbody>
                    </table>
                </div>
                <button class="back" id="logout" type="button">Logout</button>
                {% else %}
                <a href="{{ url_for('auth.signup') }}">Sign up</a>
                <a href="{{ url_for('auth.login') }}">Login</a>
                {% endif %}
            </nav>
        </div>
    </header>

    <main class="page-content">
        {% block content %}{% endblock %}
    </main>

    <script>
        window.CSRF_TOKEN = "{{ csrf_token() }}";
        window.APP_ROUTES = {
            loginUrl: "{{ url_for('auth.login') }}",
            logoutUrl: "/auth/logout",
            historyUrl: "/history",
            dashboardUrl: "{{ url_for('views.dashboard') }}",
            homeUrl: "{{ url_for('views.home') }}"
        };
    </script>
    <script src="{{ url_for('static', filename='base.js') }}"></script>
    {% block script %}{% endblock %}
</body>
</html>
